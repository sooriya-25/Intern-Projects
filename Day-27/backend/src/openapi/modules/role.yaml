components:
  schemas:
    Role_Permission:
      type: object
      required: [module]
      properties:
        module:
          type: string
          enum: [STOCKS, WATCHLIST, TODO]
        view:
          type: boolean
        add:
          type: boolean
        edit:
          type: boolean
        delete:
          type: boolean

    Role_CreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        isDefault:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Role_Permission"

    Role_UpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        isDefault:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Role_Permission"

paths:
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Roles]
      summary: Create a role
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role_CreateRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Get a role by id
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Roles]
      summary: Update a role
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role_UpdateRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Roles]
      summary: Delete a role
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      responses:
        "200":
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
