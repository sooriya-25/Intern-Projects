components:
  schemas:
    Profile_UpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1

paths:
  /profile:
    get:
      tags: [Profile]
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      summary: Update the current user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile_UpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Profile]
      summary: Soft delete the current user's own account
      description: >
        Sets isDeleted=true / deletedAt on the user's own record. The
        account can no longer authenticate afterwards (see
        auth.middleware.js and auth.service.js). Data is not hard-deleted.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/photo:
    patch:
      tags: [Profile]
      summary: Upload / replace the profile photo
      description: >
        Send as multipart/form-data with a "photo" file field. Handled
        entirely by multer — deliberately has no `requestBody` schema here
        so express-openapi-validator does not try to parse/validate the
        multipart body (it only validates documented request bodies).
        Documented for Swagger UI only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Profile]
      summary: Remove the profile photo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Photo removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
