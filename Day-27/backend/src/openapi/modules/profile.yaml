components:
  schemas:
    Profile_UpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    Profile_Session:
      type: object
      properties:
        sessionId:
          type: string
        browserName:
          type: string
          example: "Chrome"
        deviceName:
          type: string
          example: "Windows"
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean

paths:
  /profile:
    get:
      tags: [Profile]
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      summary: Update the current user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile_UpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Profile]
      summary: Permanently delete the current user's own account
      description: >
        Permanently removes the user's own record from the database.
        This cannot be undone. Notifies ADMIN_EMAIL by email that the
        account was deleted.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/photo:
    patch:
      tags: [Profile]
      summary: Upload / replace the profile photo
      description: >
        Send as multipart/form-data with a "photo" file field. Handled
        entirely by multer — deliberately has no `requestBody` schema here
        so express-openapi-validator does not try to parse/validate the
        multipart body (it only validates documented request bodies).
        Documented for Swagger UI only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Profile]
      summary: Remove the profile photo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Photo removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/sessions:
    get:
      tags: [Profile]
      summary: List the current user's active login sessions / devices
      description: >
        Each entry represents one logged-in device/browser (see
        User.sessions in models/User.js). Used by the Settings > Security
        tab.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Profile_Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Profile]
      summary: Log out every session except the current one
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Other sessions logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/sessions/{sessionId}:
    delete:
      tags: [Profile]
      summary: Log out one specific session / device
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
