components:
  schemas:
    Stock_CreateRequest:
      type: object
      required: [company, symbol, sector, exchange, currentPrice]
      properties:
        company:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        description:
          type: string
        sector:
          type: string
          minLength: 1
        exchange:
          type: string
          minLength: 1
        currency:
          type: string
        currentPrice:
          type: number
          minimum: 0
        marketCap:
          type: number
          minimum: 0

    Stock_UpdateRequest:
      type: object
      properties:
        company:
          type: string
        symbol:
          type: string
        description:
          type: string
        sector:
          type: string
        exchange:
          type: string
        currency:
          type: string
        currentPrice:
          type: number
          minimum: 0
        marketCap:
          type: number
          minimum: 0

paths:
  /stocks:
    get:
      tags: [Stocks]
      summary: List stocks
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: search
          in: query
          allowEmptyValue: true
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: company
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: List of stocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Stocks]
      summary: Create a stock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Stock_CreateRequest"
      responses:
        "201":
          description: Stock created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stocks/{id}:
    put:
      tags: [Stocks]
      summary: Update a stock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Stock_UpdateRequest"
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Stocks]
      summary: Delete a stock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      responses:
        "200":
          description: Stock deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
